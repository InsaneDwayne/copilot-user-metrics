# Regenerates the documentation screenshots (docs/images/) of main and, if they changed, pushes
# them to the docs/screenshots branch, one commit on top of main. Open a pull request from it
# to merge them. Started by hand: Actions > Screenshots > Run workflow. See
# tools/screenshots/README.md.
#
# It runs `just screenshots` in the dev container, as the release check does
# (.github/actions/screenshots), so its images are exactly what the release expects.
#
# The branch is pushed with GITHUB_TOKEN, so the push doesn't start other workflows. CI runs
# once a pull request is opened from the branch by hand.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRANCH: docs/screenshots

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the docs/screenshots branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Capture the screenshots
        id: capture
        uses: ./.github/actions/screenshots

      - name: Push the docs/screenshots branch
        if: steps.capture.outputs.changed == 'true'
        env:
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/main...docs/screenshots?expand=1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The whole folder, so a removed shot is removed on the branch too.
          git add -A docs/images
          git switch -C "$BRANCH"
          # --no-verify: the dev container's `just install` put its pre-commit hook into this
          # checkout's .git/hooks, but pre-commit only exists inside the container. Only images
          # are committed, so there's nothing for the hooks to check.
          git commit --no-verify -m "docs: refresh screenshots" -m "Regenerated by the Screenshots workflow from main ($(git rev-parse --short HEAD))."
          git push --force origin "$BRANCH"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## New screenshots on \`$BRANCH\`

          [Open a pull request]($COMPARE_URL), check the images in *Files changed*, and merge it.
          EOF
