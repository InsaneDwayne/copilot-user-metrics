name: copilot-user-metrics-dev

services:
  # Dev workspace: FastAPI, the procrastinate worker and Vite all run in here.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      # Host git identity and SSH keys (created by initializeCommand if missing).
      - ${HOME}/.gitconfig:/home/node/.gitconfig
      - ${HOME}/.gitconfig-github:/home/node/.gitconfig-github
      - ${HOME}/.ssh:/home/node/.ssh:ro
    env_file:
      # Local secrets (GitHub App id/key, OAuth client secret). Copy .env.example to .env.
      - path: .env
        required: false
    environment:
      # Owner role: migrations (Alembic, including the procrastinate schema).
      DATABASE_URL: postgresql://copilot:copilot@db:5432/copilot_metrics
      # Sync worker: the only writer of usage tables.
      WORKER_DATABASE_URL: postgresql://copilot_worker:copilot_worker@db:5432/copilot_metrics
      # Dashboard API: read-only, subject to row-level security.
      API_DATABASE_URL: postgresql://copilot_api:copilot_api@db:5432/copilot_metrics
      TEST_DATABASE_URL: postgresql://copilot:copilot@db:5432/copilot_metrics_test
      # Defaults for psql inside the container.
      PGHOST: db
      PGUSER: copilot
      PGPASSWORD: copilot
      PGDATABASE: copilot_metrics
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot_metrics
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot_metrics"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
