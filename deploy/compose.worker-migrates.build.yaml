# Override: build the image from this checkout instead of pulling a release (for testing
# unreleased changes). The image is tagged copilot-usage:local (or :$APP_VERSION if set):
#
#   docker compose -f deploy/compose.worker-migrates.yaml -f deploy/compose.worker-migrates.build.yaml up -d --build
#
# Not part of the release bundle. compose.build.yaml is the same for compose.yaml.
x-build: &build
  build:
    context: ..
    dockerfile: Dockerfile
    target: app
  image: copilot-usage:${APP_VERSION:-local}

services:
  api: *build
  worker: *build
